<!-- Sidebar -->
<aside id="sidebar" class="bg-black text-white flex flex-col flex-shrink-0 sidebar-transition h-screen hidden lg:flex" style="width: 64px;">
    <!-- Logo -->
    <div class="px-6 py-5 border-b border-neutral-800 flex items-center justify-between min-h-[62px]">
        <span id="sidebar-logo-full" class="text-sm font-bold tracking-[0.2em] uppercase text-white whitespace-nowrap nav-label-transition opacity-0">Full Capacity</span>
        <span id="sidebar-logo-short" class="text-lg font-bold text-white">FC</span>
    </div>

    <!-- Navigation -->
    <nav class="flex flex-col gap-1 px-3 py-4 flex-1">
        <a href="/dashboard" id="nav-dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150 text-neutral-500 hover:text-white hover:bg-neutral-900">
            <i data-lucide="layout-dashboard" class="w-4 h-4 flex-shrink-0"></i>
            <span class="nav-label nav-label-transition opacity-0 whitespace-nowrap">Dashboard</span>
        </a>
        <a href="/dashboard" id="nav-documents" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150 text-neutral-500 hover:text-white hover:bg-neutral-900">
            <i data-lucide="file-text" class="w-4 h-4 flex-shrink-0"></i>
            <span class="nav-label nav-label-transition opacity-0 whitespace-nowrap">Documents</span>
        </a>
        <a href="/upload" id="nav-upload" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors duration-150 text-neutral-500 hover:text-white hover:bg-neutral-900">
            <i data-lucide="upload-cloud" class="w-4 h-4 flex-shrink-0"></i>
            <span class="nav-label nav-label-transition opacity-0 whitespace-nowrap">Upload</span>
        </a>

        <div class="border-t border-neutral-800 my-3 mx-3"></div>

        <!-- Folder Tree -->
        <div id="sidebar-folders" class="flex-1 overflow-y-auto px-1 hidden">
            <p class="text-xs uppercase text-neutral-600 font-semibold mb-2 tracking-wider px-2 nav-label nav-label-transition opacity-0 whitespace-nowrap">Folders</p>
            <div id="folder-tree" class="text-sm"></div>
        </div>
    </nav>

    <!-- User section -->
    <div class="px-4 py-4 border-t border-neutral-800">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full bg-neutral-800 text-white flex items-center justify-center text-xs font-medium flex-shrink-0" id="user-avatar"></div>
            <div class="nav-label nav-label-transition opacity-0 overflow-hidden whitespace-nowrap">
                <p class="text-sm text-white truncate" id="sidebar-user-name"></p>
                <p class="text-xs text-neutral-500 truncate" id="sidebar-org-name"></p>
            </div>
        </div>
        <button onclick="logout()" class="flex items-center gap-2 px-3 py-2 mt-3 rounded-lg text-sm text-neutral-500 hover:text-white hover:bg-neutral-900 transition-colors w-full">
            <i data-lucide="log-out" class="w-4 h-4 flex-shrink-0"></i>
            <span class="nav-label nav-label-transition opacity-0 whitespace-nowrap">Sign out</span>
        </button>
    </div>

    <!-- Pin toggle -->
    <div class="px-3 py-2 border-t border-neutral-800">
        <button onclick="toggleSidebarPin()" class="flex items-center justify-center w-full py-1.5 rounded-lg text-neutral-500 hover:text-white hover:bg-neutral-900 transition-colors" title="Pin sidebar">
            <i data-lucide="pin" id="sidebar-pin-icon" class="w-4 h-4"></i>
        </button>
    </div>
</aside>

<!-- Mobile overlay -->
<div id="mobile-sidebar-backdrop" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="closeMobileSidebar()"></div>

<script>
// Sidebar state
let sidebarPinned = localStorage.getItem('sidebar-pinned') === 'true';
let sidebarHovered = false;

function setSidebarExpanded(expanded) {
    const sidebar = document.getElementById('sidebar');
    const logoFull = document.getElementById('sidebar-logo-full');
    const logoShort = document.getElementById('sidebar-logo-short');
    const folders = document.getElementById('sidebar-folders');
    const pinIcon = document.getElementById('sidebar-pin-icon');

    if (expanded) {
        sidebar.style.width = '256px';
        sidebar.querySelectorAll('.nav-label').forEach(el => {
            el.style.opacity = '1';
            el.style.display = '';
        });
        logoFull.style.opacity = '1';
        logoFull.style.display = '';
        logoShort.style.display = 'none';
        folders.classList.remove('hidden');
    } else {
        sidebar.style.width = '64px';
        sidebar.querySelectorAll('.nav-label').forEach(el => {
            el.style.opacity = '0';
            // Delay hiding so transition plays
            setTimeout(() => { if (!sidebarPinned && !sidebarHovered) el.style.display = 'none'; }, 200);
        });
        logoFull.style.opacity = '0';
        setTimeout(() => { if (!sidebarPinned && !sidebarHovered) logoFull.style.display = 'none'; }, 200);
        logoShort.style.display = '';
        folders.classList.add('hidden');
    }
    // Update pin icon
    if (pinIcon) {
        pinIcon.setAttribute('data-lucide', sidebarPinned ? 'pin-off' : 'pin');
        if (typeof lucide !== 'undefined') lucide.createIcons();
    }
}

function toggleSidebarPin() {
    sidebarPinned = !sidebarPinned;
    localStorage.setItem('sidebar-pinned', sidebarPinned);
    setSidebarExpanded(sidebarPinned);
}

function setActiveNav(id) {
    document.querySelectorAll('#sidebar nav a').forEach(a => {
        a.classList.remove('nav-active', 'text-white');
        a.classList.add('text-neutral-500');
    });
    const el = document.getElementById(id);
    if (el) {
        el.classList.add('nav-active', 'text-white');
        el.classList.remove('text-neutral-500');
    }
}

// Hover-to-expand (desktop only)
function initSidebarHover() {
    const sidebar = document.getElementById('sidebar');
    if (!sidebar) return;

    sidebar.addEventListener('mouseenter', () => {
        sidebarHovered = true;
        if (!sidebarPinned) {
            setSidebarExpanded(true);
        }
    });

    sidebar.addEventListener('mouseleave', () => {
        sidebarHovered = false;
        if (!sidebarPinned) {
            setSidebarExpanded(false);
        }
    });
}

// Mobile sidebar
function openMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('mobile-sidebar-backdrop');
    sidebar.classList.remove('hidden');
    sidebar.classList.add('fixed', 'z-50', 'left-0', 'top-0');
    sidebar.style.width = '256px';
    sidebar.querySelectorAll('.nav-label').forEach(el => { el.style.opacity = '1'; el.style.display = ''; });
    document.getElementById('sidebar-logo-full').style.opacity = '1';
    document.getElementById('sidebar-logo-full').style.display = '';
    document.getElementById('sidebar-logo-short').style.display = 'none';
    document.getElementById('sidebar-folders').classList.remove('hidden');
    backdrop.classList.remove('hidden');
}

function closeMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('mobile-sidebar-backdrop');
    sidebar.classList.remove('fixed', 'z-50', 'left-0', 'top-0');
    sidebar.classList.add('hidden', 'lg:flex');
    backdrop.classList.add('hidden');
    setSidebarExpanded(sidebarPinned);
}

document.addEventListener('DOMContentLoaded', () => {
    // Apply initial state
    setSidebarExpanded(sidebarPinned);
    // If not pinned, hide labels immediately (no transition on load)
    if (!sidebarPinned) {
        const sidebar = document.getElementById('sidebar');
        sidebar.querySelectorAll('.nav-label').forEach(el => { el.style.display = 'none'; });
        document.getElementById('sidebar-logo-full').style.display = 'none';
    }
    // Init hover behavior
    initSidebarHover();
    // Set user info from data attributes
    const avatarEl = document.getElementById('user-avatar');
    const nameEl = document.getElementById('sidebar-user-name');
    if (avatarEl && nameEl) {
        const email = nameEl.dataset.email || '';
        if (email) {
            avatarEl.textContent = email.charAt(0).toUpperCase();
        }
    }
});
</script>
