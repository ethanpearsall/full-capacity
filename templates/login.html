{% extends "base.html" %}
{% block title %}Login — Full Capacity{% endblock %}

{% block body %}
<div class="bg-black min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 mx-4">
        <div class="text-center mb-8 pb-6 border-b border-neutral-200">
            <h1 class="text-sm font-bold tracking-[0.2em] uppercase text-neutral-950">Full Capacity</h1>
        </div>

        <h2 class="text-xl font-semibold text-neutral-950 text-center mb-6">Sign in to your account</h2>

        <div id="login-error" class="hidden bg-red-50 text-red-800 border border-red-200 p-3 rounded-lg mb-4 text-sm"></div>

        <form id="login-form" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-medium text-neutral-500 uppercase tracking-wide mb-1.5">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 focus:bg-white transition-colors"
                    placeholder="you@yourfirm.com">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-neutral-500 uppercase tracking-wide mb-1.5">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 focus:bg-white transition-colors"
                    placeholder="Enter your password">
            </div>
            <button type="submit"
                class="w-full bg-neutral-950 text-white font-medium rounded-lg py-2.5 mt-6 hover:bg-neutral-800 transition-colors">
                Sign In
            </button>
        </form>

        <p class="mt-4 text-center text-xs text-neutral-500">
            Don't have an account? <a href="/signup" class="text-neutral-950 hover:underline font-medium">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('login-error');
    errorDiv.classList.add('hidden');
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
        });
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            const data = await res.json();
            errorDiv.textContent = data.detail || 'Login failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
