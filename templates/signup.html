{% extends "base.html" %}
{% block title %}Sign Up — Full Capacity{% endblock %}

{% block body %}
<div class="bg-black min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 mx-4">
        <div class="text-center mb-8 pb-6 border-b border-neutral-200">
            <h1 class="text-sm font-bold tracking-[0.2em] uppercase text-neutral-950">Full Capacity</h1>
        </div>

        <h2 class="text-xl font-semibold text-neutral-950 text-center mb-6">Create your account</h2>

        <div id="signup-error" class="hidden bg-red-50 text-red-800 border border-red-200 p-3 rounded-lg mb-4 text-sm"></div>
        <div id="signup-success" class="hidden bg-neutral-950 text-white p-3 rounded-lg mb-4 text-sm"></div>

        <form id="signup-form" class="space-y-4">
            <div>
                <label for="full_name" class="block text-xs font-medium text-neutral-500 uppercase tracking-wide mb-1.5">Full Name</label>
                <input type="text" id="full_name" name="full_name" required
                    class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 focus:bg-white transition-colors"
                    placeholder="John Smith">
            </div>
            <div>
                <label for="email" class="block text-xs font-medium text-neutral-500 uppercase tracking-wide mb-1.5">Email</label>
                <input type="email" id="email" name="email" required
                    class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 focus:bg-white transition-colors"
                    placeholder="you@yourfirm.com">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-neutral-500 uppercase tracking-wide mb-1.5">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                    class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 focus:bg-white transition-colors"
                    placeholder="Minimum 8 characters">
            </div>
            <div>
                <label for="org_name" class="block text-xs font-medium text-neutral-500 uppercase tracking-wide mb-1.5">Organisation Name</label>
                <input type="text" id="org_name" name="org_name" required
                    class="w-full bg-neutral-50 border border-neutral-200 rounded-lg px-4 py-2.5 text-sm text-neutral-900 placeholder-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-300 focus:border-neutral-400 focus:bg-white transition-colors"
                    placeholder="Your Firm LLP">
            </div>
            <button type="submit"
                class="w-full bg-neutral-950 text-white font-medium rounded-lg py-2.5 mt-6 hover:bg-neutral-800 transition-colors">
                Create Account
            </button>
        </form>

        <p class="mt-4 text-center text-xs text-neutral-500">
            Already have an account? <a href="/login" class="text-neutral-950 hover:underline font-medium">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('signup-error');
    const successDiv = document.getElementById('signup-success');
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    const data = {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        org_name: document.getElementById('org_name').value,
    };
    try {
        const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
        });
        if (res.ok) {
            successDiv.textContent = 'Account created! Redirecting...';
            successDiv.classList.remove('hidden');
            setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
        } else {
            const err = await res.json();
            errorDiv.textContent = err.detail || 'Signup failed';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = 'Network error. Please try again.';
        errorDiv.classList.remove('hidden');
    }
});
</script>
{% endblock %}
